name: showtracker
description: A local-first media tracker for TV shows, movies, books, and games.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Local Database (Drift + SQLite)
  drift: ^2.21.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.24

  # HTTP & API
  http: ^1.2.2
  cached_network_image: ^3.4.1

  # Navigation
  go_router: ^14.6.2

  # Notifications
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.0

  # Utils
  path_provider: ^2.1.4
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  home_widget: ^0.9.3
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.3.2
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
