name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Tests and coverage
        run: flutter test --no-pub --coverage --test-randomize-ordering-seed=20261029
      - name: Coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      # Debug artifacts only: no upload/signing credentials and no installation.
      - run: flutter build apk --debug --no-pub
      - name: Inspect native ELF and APK alignment
        run: python3 tool/audit_native_libraries.py build/app/outputs/flutter-apk/app-debug.apk --output build/native-libraries.json
      - name: Inspect packaged manifest and DEX
        run: python3 tool/verify_apk.py build/app/outputs/flutter-apk/app-debug.apk
