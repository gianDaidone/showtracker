# Drift genera in un target a parte, prima di tutto il resto: riverpod_generator
# deve risolvere le classi del database (TrackedShow, TrackedGame, …) usate come
# tipi dei provider, e con il builder condiviso di drift quelle classi finirebbero
# nello stesso .g.dart, che viene assemblato solo dopo riverpod_generator.
# Schema: https://drift.simonbinder.eu/generation_options/in_other_builders/
targets:
  drift:
    auto_apply_builders: false
    builders:
      drift_dev:analyzer:
        enabled: true
        options: &options
          # Sempre attivo con not_shared
          has_separate_analyzer: true
      drift_dev:not_shared:
        enabled: true
        options: *options

  $default:
    dependencies:
      - ":drift"
    builders:
      drift_dev:
        enabled: false
