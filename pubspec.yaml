name: showtracker
description: A local-first media tracker for TV shows, movies, books, and games.
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Alcuni widget Cupertino del framework usano queste icone; senza il pacchetto
  # il build avvisa che il font manca. Il tree-shaking tiene solo i glifi usati.
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Local Database (Drift + SQLite)
  drift: ^2.21.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.24

  # HTTP & API
  http: ^1.2.2
  cached_network_image: ^3.4.1

  # Navigation
  go_router: ^14.6.2

  # Notifications
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.1

  # Utils
  path_provider: ^2.1.4
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  home_widget: ^0.10.0
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.3.2
  app_links: ^7.0.0
  package_info_plus: ^10.2.2
  ota_update: ^7.1.0

  # Sync & P2P
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  network_info_plus: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  riverpod_generator: ^2.4.3

# Copia locale di home_widget 0.10.0 con una riga del build.gradle riscritta
# per togliere un falso avviso KGP — vedi third_party/README.md.
dependency_overrides:
  home_widget:
    path: third_party/home_widget

flutter:
  uses-material-design: true

  assets:
    - assets/images/
