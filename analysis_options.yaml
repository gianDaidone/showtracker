analyzer:
  exclude:
    - build/**
    - android/**
    - third_party/**
    # File di prova usa e getta nella root, non fanno parte dell'app.
    - scratch*.dart
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    avoid_print: true
    use_super_parameters: true
